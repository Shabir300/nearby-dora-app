<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NearbyPrograms - Ramadan Discovery</title>
  <meta name="theme-color" content="#065f46" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-gold: #d4af37;
      --color-emerald: #065f46;
      --color-midnight: #0f172a;
      --color-warm-beige: #fdfcf6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-warm-beige);
      color: var(--color-midnight);
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #e5e7eb;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
    }

    .glass-midnight {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .islamic-pattern {
      background-image: radial-gradient(var(--color-gold) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      opacity: 0.1;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@5.0.0?external=react,react-dom,leaflet",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
